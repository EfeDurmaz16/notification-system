name: notification-system

x-app: &app
  image: ${APP_IMAGE:-notification-system:local}
  pull_policy: never
  environment: &app-env
    DATABASE_URL: postgres://notify:notify@postgres:5432/notify?sslmode=disable
    KAFKA_BROKERS: kafka:9092
    REDIS_ADDR: redis:6379
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    KAFKA_GROUP: delivery
    BATCH_ROUTING: ${BATCH_ROUTING:-channel}
    PROVIDER_URL: ${PROVIDER_URL:-http://provider:8081/send}
    PROVIDER_IDEMPOTENT: ${PROVIDER_IDEMPOTENT:-false}
    PROVIDER_KEY_WINDOW: ${PROVIDER_KEY_WINDOW:-24h}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: postgres:17-alpine
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=4, -c, max_wal_senders=4]
    environment:
      POSTGRES_DB: notify
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-54329}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U notify -d notify]
      interval: 2s
      timeout: 3s
      retries: 45

  kafka:
    image: apache/kafka:4.1.2
    environment:
      CLUSTER_ID: jM7rGmdnTL2KPV_xgJlbrw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    ports:
      - 127.0.0.1:${KAFKA_PORT:-19092}:19092
    volumes:
      - kafkalog:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null]
      interval: 15s
      timeout: 12s
      retries: 12
      start_period: 10s

  topics:
    image: apache/kafka:4.1.2
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [bash, -euc]
    command:
      - |
        for tier in high normal low high.single normal.single low.single; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notifications.$$tier --partitions 3 --replication-factor 1
        done
        for tier in high normal low; do
          for channel in sms email push; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notifications.$$tier.batch.$$channel --partitions 1 --replication-factor 1
          done
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notifications.invalid --partitions 1 --replication-factor 1

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, always]
    volumes:
      - redisdata:/data
    ports:
      - 127.0.0.1:${REDIS_PORT:-16379}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20

  connect:
    image: quay.io/debezium/connect:3.4
    depends_on:
      topics: {condition: service_completed_successfully}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: notify-cdc
      CONFIG_STORAGE_TOPIC: notify-connect-config
      OFFSET_STORAGE_TOPIC: notify-connect-offset
      STATUS_STORAGE_TOPIC: notify-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - 127.0.0.1:${CONNECT_PORT:-18083}:8083
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://localhost:8083/connectors >/dev/null]
      interval: 8s
      timeout: 5s
      retries: 30
      start_period: 10s

  connector-init:
    image: curlimages/curl:8.17.0
    depends_on:
      connect: {condition: service_healthy}
      api: {condition: service_healthy}
    entrypoint: [sh, /deploy/register.sh]
    volumes:
      - ./deploy:/deploy:ro

  api:
    <<: *app
    build:
      context: .
    command: [api]
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      - 127.0.0.1:${API_PORT:-8080}:8080
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 4s
      timeout: 3s
      retries: 45

  worker:
    <<: *app
    command: [worker]
    stop_grace_period: 50s
    depends_on:
      connector-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      provider: {condition: service_healthy}
    environment:
      <<: *app-env
      PROVIDER_429_NOT_ACCEPTED: ${PROVIDER_429_NOT_ACCEPTED:-}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-6}
      RETRY_BASE_BACKOFF: ${RETRY_BASE_BACKOFF:-2s}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-24}
      BATCH_SHARE_PERCENT: ${BATCH_SHARE_PERCENT:-20}

  provider:
    <<: *app
    entrypoint: [/app/provider]
    environment:
      PROVIDER_ADDR: ":8081"
      PROVIDER_IDEMPOTENT: ${PROVIDER_IDEMPOTENT:-false}
      PROVIDER_LATENCY: ${PROVIDER_LATENCY:-20ms}
    ports:
      - 127.0.0.1:${PROVIDER_PORT:-8090}:8081
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/health]
      interval: 4s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.73.0
    profiles: [tracing]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:${JAEGER_PORT:-16686}:16686

volumes:
  pgdata:
  kafkalog:
  redisdata:
